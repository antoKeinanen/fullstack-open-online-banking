apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  labels:
    app: user-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: user-service:latest
          ports:
            - name: grpc
              containerPort: 50052
            - name: health
              containerPort: 8081
          env:
            - name: USER_SERVICE_PORT
              value: "50052"
            - name: USER_SERVICE_HEALTH_PORT
              value: "8081"
            - name: USER_SERVICE_TIGERBEETLE_SERVICE_URL
              value: "tigerbeetle-service:50051"
            - name: USER_SERVICE_DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: user-service-secrets
                  key: database-dsn
            - name: USER_SERVICE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: user-service-secrets
                  key: jwt-secret
            - name: USER_SERVICE_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "otel-collector:4317"
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          # Startup probe - allows up to 150s for initial startup
          startupProbe:
            httpGet:
              path: /health/startup
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          # Liveness probe - restarts container if it becomes unresponsive
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness probe - removes from service if dependencies are unhealthy
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  selector:
    app: user-service
  ports:
    - name: grpc
      port: 50052
      targetPort: grpc
    - name: health
      port: 8081
      targetPort: health
