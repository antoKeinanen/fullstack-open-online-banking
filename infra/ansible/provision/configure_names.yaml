- name: Configure K3s cluster with unique hostnames
  hosts: k3s_cluster
  become: yes
  tasks:
    - name: Set hostname
      hostname:
        name: "{{ node_name }}"

    - name: Update /etc/hosts
      lineinfile:
        path: /etc/hosts
        regexp: "^127.0.1.1"
        line: "127.0.1.1 {{ node_name }}"
